name: Feature
description: Something Eden should do that it doesn't yet.
labels: [feature]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What Eden should do, as you would use it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Today
      description: What Eden does now, if it changes something that exists, and on which build.
      placeholder: On 87d1999, ⌘T opens a blank tab…
    validations:
      required: false
  - type: textarea
    id: borrowed
    attributes:
      label: What to copy
      description: How it works where it already works well, in your own words. Don't name the product.
      placeholder: Each group a tinted surface in the column, folding on a quick spring…
    validations:
      required: false
  - type: dropdown
    id: devices
    attributes:
      label: Where
      multiple: true
      options:
        - Mac
        - iPhone
        - iPad
        - Not device-specific
    validations:
      required: true
